name: Build & Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    name: 🔨 Build Docker Image (GitHub Action)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Set image name (lowercase)
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Set image name (lowercase)
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: 📤 Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "compose.yml,Caddyfile"
          target: "~/checkin"
          overwrite: true

      - name: 🔄 Pull image & restart services on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="$HOME/checkin"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Đăng nhập GHCR trên VPS để pull image từ package
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Kiểm tra bắt buộc phải có file .env do bạn tự tạo
            if [ ! -f .env ]; then
              echo "❌ LỖI: Không tìm thấy file .env tại $DEPLOY_DIR/.env"
              echo "👉 Vui lòng tạo file .env trên VPS theo hướng dẫn trước khi deploy."
              exit 1
            fi

            # Đảm bảo IMAGE_NAME luôn trỏ tới image mới nhất vừa build
            export IMAGE_NAME="${{ env.IMAGE_NAME }}:latest"

            echo "Kéo image mới nhất: $IMAGE_NAME"
            docker compose pull app

            echo "Khởi động container..."
            docker compose up -d

            echo "Dọn dẹp image cũ..."
            docker image prune -f

            echo "=== Trạng thái dịch vụ sau khi deploy ==="
            docker compose ps
